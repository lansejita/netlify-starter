[build]
  command = "cd netlify/functions && npm install @waline/vercel serverless-http"

[build.environment]
  NODE_VERSION = "24"

[functions]
  directory = "netlify/functions/"
  node_bundler = "none"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/comment/:splat"
  status = 200
  force = true
